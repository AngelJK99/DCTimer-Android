plugins {
    id 'com.android.application'
}


android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.dctimer"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 43
        versionName "1.3 Beta"
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    namespace 'com.dctimer'
}

repositories {
    maven { url "https://dl.bintray.com/dasar/maven" }
}



dependencies {
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation project(':AESLibrary')
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    //implementation 'uz.shift:colorpicker:0.5@aar'
    //implementation 'com.wdullaer:materialdatetimepicker:3.6.4'
    //implementation 'com.whiteelephant:monthandyearpicker:1.3.0'
    //implementation files('libs/aes.jar')
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}

